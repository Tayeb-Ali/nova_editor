name: nova_editor
description: >-
  A focused Flutter code editor on top of re_editor: gutter, folding,
  completion popup, find bar and soft-keyboard input policy, with no app
  state or provider dependencies.
version: 0.1.1
repository: https://github.com/Tayeb-Ali/nova_editor
issue_tracker: https://github.com/Tayeb-Ali/nova_editor/issues
topics:
  - editor
  - code-editor
  - ide
  - flutter

screenshots:
  - description: Tap-only completion popup with parameter and return detail.
    path: doc/completion.png
  - description: In-editor find bar with a match counter.
    path: doc/find.png

environment:
  sdk: ^3.13.3
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  re_editor: ^0.10.0
  re_highlight: ^0.0.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
